[project]
name = "themis"
version = "0.1.0"
description = "Reference AIMarket agent for evidence-based AI-agent procurement review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.10",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.12,<1",
]

[project.urls]
Documentation = "https://github.com/alexar76/themis#readme"
Issues = "https://github.com/alexar76/themis/issues"
Repository = "https://github.com/alexar76/themis"

[tool.hatch.build.targets.wheel]
only-include = [
    "agent.py",
    "auditor.py",
    "configure_provider.py",
    "metis_advisor.py",
    "models.py",
    "provider_signing.py",
    "validate_manifest.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/agent.py",
    "/auditor.py",
    "/configure_provider.py",
    "/metis_advisor.py",
    "/models.py",
    "/provider_signing.py",
    "/validate_manifest.py",
    "/capability.json",
    "/examples",
    "/tests",
    "/docs",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE",
    "/Dockerfile",
    "/.dockerignore",
    "/.env.example",
    "/Makefile",
    "/pyproject.toml",
    "/uv.lock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=agent --cov=auditor --cov=configure_provider --cov=metis_advisor --cov=models --cov=provider_signing --cov=validate_manifest --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
