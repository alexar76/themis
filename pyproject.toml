[project]
# `aimarket-themis`, NOT `themis`. The short name belongs to somebody else on PyPI — version
# 0.1.0 of "a dataflow-based framework for writing robot control code", published 2016 — so
# `pip install themis` fetches a stranger's robotics library, and this project could never have
# been uploaded under that name anyway. Same incident class as the one recorded at the top of
# oracles/core/pyproject.toml, where an unprefixed short name resolved to a stranger's package
# and installed colliding top-level modules. Caught before first publish by
# oracles/core/tests/test_packaging.py::test_every_core_consumer_is_namespaced, which applies
# core's naming rule by dependency edge rather than by directory. Matches the sibling
# convention: aimarket-metis, aimarket-momus, aimarket-basanos, aimarket-atlas, aimarket-logos.
# Do not shorten this name.
name = "aimarket-themis"
version = "0.1.0"
description = "Reference AIMarket agent for evidence-based AI-agent procurement review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# NOT PUBLISHABLE, and enforced rather than merely intended: PyPI rejects any upload carrying
# this classifier. THEMIS is a clone-and-run service, not a library — the README's only install
# path is `git clone` + `uv sync`, and the Dockerfile starts it with `python agent.py`. The
# pyproject exists for dependency management, and its wheel/sdist targets are what `uv sync`
# needs, not a release artifact.
#
# The reason to state it in the metadata instead of leaving it implicit: this project has a FLAT
# layout, so a wheel built from it installs ten bare top-level modules — `agent`, `models`,
# `federation`, `auditor`, `attest`, `attestations`, `configure_provider`, `metis_advisor`,
# `provider_signing`, `validate_manifest`. `models` and `agent` in site-packages collide with
# anything else that ships a module of that name, which is the second half of the incident
# recorded at the top of oracles/core/pyproject.toml: an unprefixed name that installed
# colliding top-level modules. Renaming the distribution to `aimarket-themis` fixed the name
# half; nothing about the name fixes this half.
#
# So there are exactly two honest states for this project, and this is the cheap one:
#   * not published — this classifier, no import changes, no risk to the running service;
#   * published — move the ten modules into a `themis/` package first (the convention every
#     sibling follows: momus, logos, treasury, gaia all declare `packages = ["<name>"]`), and
#     update the imports, the pytest `--cov=` list, the Dockerfile CMD and the deploy together.
# Remove this classifier only as part of the second one.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    # The federation manifest is signed over the HUB's canonical form. oracle_core owns that
    # formula (and the scar tissue: when the hub grew a fifth field, every oracle manifest
    # failed verification and none could federate). Depending on the published 0.3.0 —
    # byte-identical to the monorepo copy — beats a hand-written copy per satellite.
    "aimarket-oracle-core>=0.3",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.10",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.12,<1",
]

[project.urls]
Documentation = "https://github.com/alexar76/themis#readme"
Issues = "https://github.com/alexar76/themis/issues"
Repository = "https://github.com/alexar76/themis"

[tool.hatch.build.targets.wheel]
only-include = [
    "agent.py",
    "attest.py",
    "attestations.py",
    "auditor.py",
    "configure_provider.py",
    "federation.py",
    "metis_advisor.py",
    "models.py",
    "provider_signing.py",
    "validate_manifest.py",
    "ui",
    "examples",
]

[tool.hatch.build.targets.sdist]
include = [
    "/agent.py",
    "/attest.py",
    "/attestations.py",
    "/auditor.py",
    "/configure_provider.py",
    "/federation.py",
    "/metis_advisor.py",
    "/models.py",
    "/provider_signing.py",
    "/validate_manifest.py",
    "/capability.json",
    "/examples",
    "/ui",
    "/tests",
    "/docs",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE",
    "/Dockerfile",
    "/.dockerignore",
    "/.env.example",
    "/Makefile",
    "/pyproject.toml",
    "/uv.lock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=agent --cov=attest --cov=attestations --cov=auditor --cov=configure_provider --cov=federation --cov=metis_advisor --cov=models --cov=provider_signing --cov=validate_manifest --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
